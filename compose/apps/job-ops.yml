# job-ops.yml — Automated job search, scoring, and application tracking
# Deploy: docker compose -f compose/apps/job-ops.yml up -d
# Node: milkymiracle (192.168.50.122) — i5-9500T, 16GB, NVMe
# Domain: jobs.example.com
# Requires: .env file at /DATA/Apps/job-ops/.env

services:
  job-ops:
    image: ghcr.io/dakheera47/job-ops:latest
    container_name: job-ops
    ports:
      - "3005:3001"
    volumes:
      - /DATA/Apps/job-ops/data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3001
      - PYTHON_PATH=/usr/bin/python3
    env_file:
      - path: /DATA/Apps/job-ops/.env
        required: false
    networks:
      - traefik-overlay
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # OpenCode Go shim — injects the x-opencode-session header Go requires, and
  # downgrades response_format json_schema -> json_object (Go rejects json_schema
  # with an opaque 400 that Job Ops will not fall back past).
  # Job Ops is pointed at http://go-shim:8090/v1 (provider: openai_compatible).
  go-shim:
    image: node:22-alpine
    container_name: jobops-go-shim
    command: ["node", "/app/server.mjs"]
    working_dir: /app
    volumes:
      - ./go-shim:/app:ro
    environment:
      - PORT=8090
      - GO_UPSTREAM=https://opencode.ai/zen/go
      - GO_SESSION=job-ops
      - GO_USER_AGENT=job-ops/1.0
    networks:
      traefik-overlay:
        aliases:
          - go-shim
          - jobops-go-shim
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8090/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  traefik-overlay:
    external: true
