# infra.yml — Swarm infrastructure stack (historical reference only)
# Deploy: docker stack deploy -c compose/stacks/infra.yml infra
# Node: milkymiracle (Traefik + CrowdSec bouncer)
#
# NOTE (2026-08-01): The crowdsec-bouncer Docker service is RETIRED. CrowdSec
# now runs natively on all 3 nodes (crowdsec.service +
# crowdsec-firewall-bouncer.service, nftables). This file is kept for
# historical reference only and is NOT deployed — excluded from CI image
# scans for the same reason.

version: "3.9"

networks:
  traefik-public:
    external: true

services:
  crowdsec-bouncer:
    image: fbonalair/traefik-crowdsec-bouncer:latest
    environment:
      CROWDSEC_AGENT_HOST: ${CROWDSEC_AGENT_HOST}
      CROWDSEC_BOUNCER_API_KEY: ${CROWDSEC_BOUNCER_API_KEY}
      PORT: "7070"
      GIN_MODE: release
      TRUSTED_PROXIES: "0.0.0.0/0"
    networks:
      - traefik-public
    deploy:
      placement:
        constraints:
          - node.hostname == milkymiracle
      restart_policy:
        condition: any
      resources:
        limits:
          memory: 64M
