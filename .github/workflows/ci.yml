name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # weekly Monday 06:00 UTC — security trend check

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (yamllint / ansible-lint / bash -n)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install linters
        run: pip install yamllint ansible-lint
      - name: Install ansible collections
        run: |
          if [ -d ansible ]; then
            cd ansible && ansible-galaxy collection install -r requirements.yml
          fi
      - name: YAML lint
        run: yamllint -c .yamllint .
      - name: Ansible lint
        run: |
          if [ -d ansible ]; then
            cd ansible && ansible-lint
          else
            echo "ansible/ not present — skipping"
          fi
      - name: Shell syntax check
        run: |
          for f in scripts/*.sh; do
            bash -n "$f" || exit 1
          done

  compose-validate:
    name: Validate compose files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          cp .env.example .env
          for f in compose/nodes/*.yml compose/stacks/*.yml compose/apps/*.yml; do
            # compose/apps/searxng-settings.yml is a SearXNG settings file
            # (settings.yml format), NOT a compose spec — `docker compose
            # config` rejects it by design. It is covered by yamllint only.
            [ "$f" = "compose/apps/searxng-settings.yml" ] && continue
            # Note: `docker compose config` does not stat build contexts
            # (camofox's /home/user/docker/build/camofox does not exist on
            # the runner) — context presence is only checked at `build` time.
            echo "==> $f"
            docker compose -f "$f" config -q || exit 1
          done

  trivy:
    name: Trivy image scan (CRITICAL gate, HIGH report)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan compose images
        run: |
          # Gate design (revised 2026-09-21):
          #   CRITICAL  -> fails the build, EXCEPT for images listed in
          #                .trivy-lag-images (below).
          #   HIGH      -> reported per-image in the job summary, never fails:
          #                every image tracks a moving tag and upstreams rebuild
          #                on their own cadence (komga ships 2022-era layers).
          #   .trivyignore      -> precise, per-CVE, dated accepts.
          #   .trivy-lag-images -> coarse, per-image advisory list, for images
          #                whose CRITICALs are ALL known upstream rebuild-lag.
          #                Rationale: per-CVE entries for images we merely
          #                *run* multiply on every upstream release — 2026-09-21
          #                added 125 to uptime-kuma alone, which left the gate
          #                permanently red and therefore ignored. An image that
          #                is NOT on this list still fails on any CRITICAL.
          #   Diun notifies on upstream rebuilds — the trigger to re-check and
          #   drop entries. The build warns when a listed image scans clean.
          #   Weekly schedule (see cron below) trends the counts.
          images=$(grep -hoE 'image: [^ ]+' compose/nodes/*.yml compose/stacks/*.yml compose/apps/*.yml | awk '{print $2}' | sed 's/"//g' | sort -u)
          lag_file=".trivy-lag-images"
          rc=0
          summary="| Image | CRITICAL | HIGH | Status |"
          summary+=$'\n|---|---|---|---|'
          lagged_clean=""
          for img in $images; do
            # Local builds don't exist on the runner (no registry image):
            #   camofox-browser:local (camofox), qbittorrent-ee:latest
            #   (download client), 5etools:local (5etools, when present).
            # fbonalair/traefik-crowdsec-bouncer: retired 2026-08-01
            # (CrowdSec runs natively via crowdsec-firewall-bouncer now);
            # compose/stacks/infra.yml is kept as a historical reference.
            case "$img" in
              camofox-browser:local|qbittorrent-ee:latest|5etools:local|fbonalair/traefik-crowdsec-bouncer:latest)
                echo "SKIP $img (local build or retired service)" && continue ;;
            esac
            echo "==> $img"
            # Mount .trivyignore into the trivy container — the container
            # has no access to the repo checkout otherwise (cwd is not
            # GITHUB_WORKSPACE). Ignored CVEs are triaged in .trivyignore.
            docker run --rm \
              -v "$PWD/.trivyignore:/.trivyignore:ro" \
              aquasec/trivy:latest image \
              --ignorefile /.trivyignore \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --no-progress \
              --format json "$img" > "/tmp/scan.json" || true
            # grep-count severities from trivy's JSON (no python -c
            # indentation pitfalls inside YAML block scalars). With
            # --severity HIGH,CRITICAL trivy emits only those severities.
            crit=$(grep -o '"Severity": "CRITICAL"' /tmp/scan.json | wc -l)
            high=$(grep -o '"Severity": "HIGH"' /tmp/scan.json | wc -l)
            echo "  CRITICAL=$crit HIGH=$high"
            if grep -qxF "$img" "$lag_file" 2>/dev/null; then
              if [ "${crit:-0}" -gt 0 ]; then
                echo "  KNOWN-LAG (advisory — does not fail the build)"
                summary+=$'\n'"| ${img} | ${crit} | ${high} | ⚠️ known-lag (advisory) |"
              else
                echo "  WARNING: listed in ${lag_file} but scans clean — remove it"
                lagged_clean="${lagged_clean} ${img}"
                summary+=$'\n'"| ${img} | ${crit} | ${high} | ✅ clean (stale lag entry) |"
              fi
            elif [ "${crit:-0}" -gt 0 ]; then
              summary+=$'\n'"| ${img} | ${crit} | ${high} | ❌ FAIL |"
              rc=1
            else
              summary+=$'\n'"| ${img} | ${crit} | ${high} | ✅ |"
            fi
          done
          if [ -n "$lagged_clean" ]; then
            echo "::warning::.trivy-lag-images lists image(s) that now scan clean — remove:${lagged_clean}"
          fi
          echo "$summary" >> "$GITHUB_STEP_SUMMARY"
          echo "exit-code=$rc" >> "$GITHUB_OUTPUT"
          exit $rc
