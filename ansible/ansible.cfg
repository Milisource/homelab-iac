# ansible.cfg — Ansible configuration for the 3-node homelab swarm
#
# Canonical usage (from inside this directory):
#   ansible-playbook playbooks/site.yml --check    # audit, touches nothing
#   ansible-playbook playbooks/site.yml            # apply common state
#   ansible-playbook playbooks/deploy.yml          # sync repo -> nodes + up -d
#
# NOTE: the inventory path below is resolved relative to the working
# directory you invoke ansible from — always run from ansible/.

[defaults]
# Single YAML inventory: group definitions + per-host connection vars
inventory = inventory/homelab.yml

# 3 hosts total — wider forks add no value and hammer SSH connections
forks = 3

# LAN is trusted and host keys rotate on reimage — accept on first contact.
# All nodes are reachable only on RFC1918 addresses, so this is low risk.
host_key_checking = False

# All 3 nodes run Ubuntu 24.04 with a system python3; auto_silent picks it
# without the noisy "discovered interpreter" banner on every run.
interpreter_python = auto_silent

[ssh_connection]
# Multiplexed connections: one TCP session per node, reused across tasks.
# The per-host ControlPath is set in inventory/homelab.yml
# (ansible_ssh_common_args) and overrides anything set here, which keeps
# multiplexing consistent even for ad-hoc `ansible` CLI runs.
ssh_args = -o ControlMaster=auto -o ControlPersist=10m -o ServerAliveInterval=30
