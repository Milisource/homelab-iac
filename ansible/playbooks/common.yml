---
# common.yml — idempotent baseline applied to ALL hosts
# ---------------------------------------------------------------------------
# This is the AUDIT + APPLY playbook:
#   audit : ansible-playbook playbooks/site.yml --check   (dry run, safe)
#   apply : ansible-playbook playbooks/site.yml           (idempotent)
#
# v1 design rules:
#   - Every task is idempotent and --check friendly; nothing destructive.
#   - No sudo unless unavoidable: everything below lives under paths owned
#     by `user`, so become stays off. Only apt + timezone escalate, and
#     both are no-ops when the node state is already correct.
# ---------------------------------------------------------------------------

- name: "Common node configuration — all 3 swarm nodes"
  hosts: all
  gather_facts: true
  become: false  # default; only the apt and timezone tasks escalate

  tasks:
    # ── 1) User user ─────────────────────────────────────────────────────
    - name: "Ensure user 'user' exists with /bin/bash"
      ansible.builtin.user:
        name: user
        state: present
        shell: /bin/bash
        groups:
          - sudo
          - docker
        append: true
      # WHY append: only ADD sudo+docker membership — never remove groups
      # user already has (e.g. `video` on milkymiracle for /dev/dri).
      # WHY no password/key management: auth is intentionally untouched in
      # v1 — keys are hand-placed (~/.ssh/id_ed25519) and the sudoers
      # whitelist is monitored by the Hermes watchdog (see README).
      # Note: the `docker` group must exist for this to succeed — it does,
      # Docker is preinstalled on all 3 nodes (task 2 below).

    # ── 2) Docker engine + compose plugin ─────────────────────────────────
    - name: "Ensure docker-ce + docker-compose-plugin are installed"
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-compose-plugin
        state: present
        update_cache: false
      become: true
      # WHY update_cache: false — apt sources and repo keys were set up by
      # hand; v1 does NOT manage apt sources (drift risk, and all nodes are
      # already on Docker 29.6.1). This task is a guarantee, not an
      # installer: it no-ops while the packages are present.
      # become: apt needs root; passwordless sudo is configured on nodes.

    # ── 3) Compose dir ────────────────────────────────────────────────────
    - name: "Ensure per-node compose directory exists"
      ansible.builtin.file:
        path: "{{ compose_dir }}"
        state: directory
        mode: "0755"
      # user owns /home/user/docker — no sudo needed.

    # ── 4) Traefik dynamic config dir ─────────────────────────────────────
    - name: "Ensure Traefik dynamic config directory exists"
      ansible.builtin.file:
        path: "{{ traefik_dynamic_dir }}"
        state: directory
        mode: "0755"
      # /etc/traefik itself is root-owned; the dynamic/ SUBDIR is user-owned
      # and writable without sudo. We deliberately run without become and
      # only ensure the subdir — if it were ever missing, this fails loudly
      # instead of silently creating a root-owned dir we can't maintain.

    # ── 5) Timezone ───────────────────────────────────────────────────────
    - name: "Ensure timezone is {{ timezone }}"
      community.general.timezone:
        name: "{{ timezone }}"
      become: true
      # The one genuinely privileged write (timedatectl set-timezone).
      # Idempotent: no-op when already correct, safe under --check.
      # community.general.timezone: the `timezone` module was removed from
      # ansible-core in 2.14 (was ansible.builtin.timezone) — see
      # requirements.yml.

    # ── 6) Explicitly NOT in v1 ───────────────────────────────────────────
    - name: "Note what common.yml deliberately does not manage"
      ansible.builtin.debug:
        msg:
          - "common.yml v1 finished on {{ inventory_hostname }}."
          - "NOT managed in v1 (see comment block below + README):"
          - "  - sudoers whitelist    (Hermes watchdog monitors it)"
          - "  - NFS fstab / exports  (USB->SATA migration pending)"
          - "  - systemd units/timers (hand-deployed; see servers/*.md)"
          - "  - cron entries         (hand-deployed, incl. deadman-ping)"
          - "  - nftables / firewall  (CrowdSec bouncer owns the rules)"
          - "  - unattended-upgrades, borgmatic, keepalived, samba, unbound"

# ---------------------------------------------------------------------------
# What is explicitly OUT of scope for v1, and why:
#
# - sudoers whitelist: Hermes' watchdog cross-checks it; Ansible writing it
#   would fight the agent and risk locking out SSH automation entirely.
# - NFS (client fstab on milkymiracle/heavensfeel, /etc/exports on
#   milis-wonderspace): live-tuned around the dying USB enclosure;
#   templatizing now would drift from the post-migration reality. Revisit
#   after the SATA migration lands.
# - systemd units + timers (sync-qbit-port, cleanup-stale-mounts,
#   bump-recent-media-mtime, smart-health-check, crowdsec-hubupdate) and
#   cron entries (deadman-ping, lrc-sync): already deployed and stable by
#   hand; v1 would need to model "present with exact content" for ~10
#   units to add value — future work, not v1.
# - nftables: CrowdSec firewall-bouncer manages rules dynamically.
# - unattended-upgrades / borgmatic: host-specific, secret-adjacent config;
#   document, don't templatize, until v2.
#
# Rule of thumb: if a human hand-tunes it on the node, Ansible does not own
# it yet. Always run `ansible-playbook playbooks/site.yml --check` first.
# ---------------------------------------------------------------------------
