---
# common.yml — idempotent baseline applied to ALL hosts
# ---------------------------------------------------------------------------
# This is the AUDIT + APPLY playbook:
#   audit : ansible-playbook playbooks/site.yml --check   (dry run, safe)
#   apply : ansible-playbook playbooks/site.yml           (idempotent)
#
# v1 design rules:
#   - Every task is idempotent and --check friendly; nothing destructive.
#   - NO sudo anywhere. The nodes' sudoers is two-layer: password-gated
#     `%sudo` (human admin, TTY only — unreachable from non-TTY Ansible)
#     + a NOPASSWD read-only whitelist (/etc/sudoers.d/hermes-agent, for
#     the automation agent, watchdog-monitored). v1 owns only paths the
#     user can write without elevation. The two v1-draft privileged tasks
#     (apt install, timezone) were dropped after the first audit hit
#     "Missing sudo password" on all 3 nodes — see README "Out of scope
#     v1". Revisit in v2 behind a narrowly-scoped, watchdog-blessed
#     NOPASSWD entry if needed.
# ---------------------------------------------------------------------------

- name: "Common node configuration — all 3 swarm nodes"
  hosts: all
  gather_facts: true
  become: false  # NO sudo anywhere in v1 — every task runs as the user

  tasks:
    # ── 1) User ─────────────────────────────────────────────────────────
    - name: "Ensure user 'user' exists with /bin/bash"
      ansible.builtin.user:
        name: user
        state: present
        shell: /bin/bash
        groups:
          - sudo
          - docker
        append: true
      # WHY append: only ADD sudo+docker membership — never remove groups
      # the user already has (e.g. `video` on the media node for /dev/dri).
      # WHY no password/key management: auth is intentionally untouched in
      # v1 — keys are hand-placed (~/.ssh/id_ed25519) and the sudoers
      # whitelist is watchdog-monitored (see README).
      # Note: the `docker` group must exist for this to succeed — it does,
      # Docker is preinstalled on all 3 nodes.

    # ── 2) Compose dir ──────────────────────────────────────────────────
    - name: "Ensure per-node compose directory exists"
      ansible.builtin.file:
        path: "{{ compose_dir }}"
        state: directory
        mode: "0755"
      # the user owns /home/user/docker — no sudo needed.

    # ── 3) Traefik dynamic config dir ───────────────────────────────────
    - name: "Ensure Traefik dynamic config directory exists"
      ansible.builtin.file:
        path: "{{ traefik_dynamic_dir }}"
        state: directory
        mode: "0755"
      # /etc/traefik itself is root-owned; the dynamic/ SUBDIR is owned by
      # the user and writable without sudo. We deliberately run without
      # become and only ensure the subdir — if it were ever missing, this
      # fails loudly instead of silently creating a root-owned dir we
      # can't maintain.

    # ── 4) Explicitly NOT in v1 ─────────────────────────────────────────
    - name: "Note what common.yml deliberately does not manage"
      ansible.builtin.debug:
        msg:
          - "common.yml v1 finished on {{ inventory_hostname }}."
          - "NOT managed in v1 (see comment block below + README):"
          - "  - sudoers whitelist    (watchdog-monitored)"
          - "  - apt / package state  (needs root; read-only whitelist)"
          - "  - timezone             (already set on all 3)"
          - "  - NFS fstab / exports  (storage migration pending)"
          - "  - systemd units/timers (hand-deployed; see docs)"
          - "  - cron entries         (hand-deployed)"
          - "  - nftables / firewall  (IPS bouncer owns the rules)"
          - "  - unattended-upgrades, backups, keepalived, samba, dns"

# ---------------------------------------------------------------------------
# What is explicitly OUT of scope for v1, and why:
#
# - apt / package state + timezone: both require root, but the nodes'
#   sudoers has a NOPASSWD read-only whitelist (watchdog-monitored), so
#   the v1-draft privileged tasks failed the first audit run with
#   "Missing sudo password". All 3 nodes are already on Docker 29.6.1 and
#   the right timezone, so v1 loses nothing. If package-drift detection is
#   wanted in v2, add a narrowly-scoped, watchdog-blessed NOPASSWD entry —
#   NOT a broad `apt*` grant (root-escalation vector via dpkg postinst).
# - sudoers (NOPASSWD layer): the watchdog cross-checks it; Ansible
#   writing it would fight the automation and risk locking out SSH
#   automation entirely. The password-gated `%sudo` layer is human-only.
# - NFS (client fstab + /etc/exports): live-tuned around storage
#   hardware; templatizing now would drift from the post-migration
#   reality. Revisit after the migration lands.
# - systemd units + timers and cron entries: already deployed and stable
#   by hand; v1 would need to model "present with exact content" for
#   ~10 units to add value — future work, not v1.
# - nftables: the IPS firewall-bouncer manages rules dynamically.
# - unattended-upgrades / backup config: host-specific, secret-adjacent;
#   document, don't templatize, until v2.
#
# Rule of thumb: if a human hand-tunes it on the node, Ansible does not
# own it yet. Always run `ansible-playbook playbooks/site.yml --check` first.
# ---------------------------------------------------------------------------
