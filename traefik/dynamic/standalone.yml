# ──────────────────────────────────────────────────────────────────────────────
# standalone.yml — Traefik dynamic router config (file provider)
# ──────────────────────────────────────────────────────────────────────────────
# Rate limiting is applied PER-ROUTER, not at the entrypoint level, so SPA
# static assets (JS chunks, CSS, fonts) are not rate-limited.  Only API paths
# or full hosts (for non-SPA services) carry the rate-limit middleware.
# See dynamic.yml for middleware definitions.
#
# When adding a new service:
#   - SPA (many JS chunks): add TWO routers — one for API paths with
#     `middlewares: [rate-limit]`, one catch-all without.
#   - Non-SPA (minimal frontend): add `middlewares: [rate-limit]` to a single
#     router.  If it's internal-only, omit rate-limit.
#
# This file must exist on EVERY node that runs a Traefik replica.
# Currently: milkymiracle (122), heavensfeel (129), milis-wonderspace (115)
#
# Source of truth: the private infra repo, synced to this public mirror with
# domains and paths sanitized. CI lints + validates + Trivy-scans this file.
# ──────────────────────────────────────────────────────────────────────────────

http:

  # ── Servers Transports ─────────────────────────────────────────────────────
  serversTransports:
    cockpit-transport:
      insecureSkipVerify: true

  # ── Routers ─────────────────────────────────────────────────────────────────
  routers:

    # ── heavensfeel (apps stack) ───────────────────────────────────────────────
    vaultwarden:
      entryPoints: [websecure]
      rule: "Host(`vault.example.com`)"
      service: vaultwarden
      middlewares: [rate-limit]
      tls: { certResolver: le }

    # n8n SPA — API/webhook paths rate-limited, static assets bypass
    n8n-api:
      entryPoints: [websecure]
      rule: "Host(`n8n.example.com`) && (PathPrefix(`/rest`) || PathPrefix(`/webhook`) || PathPrefix(`/webhook-waiting`))"
      service: n8n
      middlewares: [rate-limit]
      tls: { certResolver: le }
    n8n:
      entryPoints: [websecure]
      rule: "Host(`n8n.example.com`)"
      service: n8n
      tls: { certResolver: le }

    archisteamfarm:
      entryPoints: [websecure]
      rule: "Host(`asf.example.com`)"
      service: archisteamfarm
      tls: { certResolver: le }

    # ── milis-wonderspace (media stack) ────────────────────────────────────────
    copyparty:
      entryPoints: [websecure]
      rule: "Host(`cloud.example.com`)"
      service: copyparty
      tls: { certResolver: le }

    navidrome:
      entryPoints: [websecure]
      rule: "Host(`navi.example.com`)"
      service: navidrome
      tls: { certResolver: le }

    jellyseerr:
      entryPoints: [websecure]
      rule: "Host(`serr.example.com`)"
      service: jellyseerr
      tls: { certResolver: le }

    sonarr:
      entryPoints: [websecure]
      rule: "Host(`sonarr.example.com`)"
      service: sonarr
      tls: { certResolver: le }

    radarr:
      entryPoints: [websecure]
      rule: "Host(`radarr.example.com`)"
      service: radarr
      tls: { certResolver: le }

    lidarr:
      entryPoints: [websecure]
      rule: "Host(`lidarr.example.com`)"
      service: lidarr
      tls: { certResolver: le }

    komga:
      entryPoints: [websecure]
      rule: "Host(`komga.example.com`)"
      service: komga
      tls: { certResolver: le }

    # ── milkymiracle (media + compute) ─────────────────────────────────────────
    jellyfin:
      entryPoints: [websecure]
      rule: "Host(`jellyfin.example.com`)"
      service: jellyfin
      tls: { certResolver: le }

    foundryvtt:
      entryPoints: [websecure]
      rule: "Host(`foundry.example.com`)"
      service: foundryvtt
      tls: { certResolver: le }

    archivebox:
      entryPoints: [websecure]
      rule: "Host(`archive.example.com`)"
      service: archivebox
      middlewares: [rate-limit]
      tls: { certResolver: le }

    # ── Cross-node services ────────────────────────────────────────────────────
    homepage:
      entryPoints: [websecure]
      rule: "Host(`home.example.com`)"
      service: homepage
      tls: { certResolver: le }

    jobs:
      entryPoints: [websecure]
      rule: "Host(`jobs.example.com`)"
      service: jobs
      tls: { certResolver: le }

    # ── milis-wonderspace services ────────────────────────────────────────
    # DISABLED 2026-10-19 (Bazarr RCE incident): public route removed; Bazarr is LAN-only.
    # bazarr:
    #   entryPoints: [websecure]
    #   rule: "Host(`bazarr.example.com`)"
    #   service: bazarr
