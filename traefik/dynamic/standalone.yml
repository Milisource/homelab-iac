    # ── 5e.tools (static SPA, heavensfeel) ─────────────────────────────────────
    5etools:
      entryPoints: [websecure]
      rule: "Host(`5etools.example.com`)"
      service: 5etools
      tls: { certResolver: le }

    # ── Fabula Ultima campaign logs (static, heavensfeel) ──────────────────────
    fabula:
      entryPoints: [websecure]
      rule: "Host(`fabula.example.com`)"
      service: fabula
      tls: { certResolver: le }

    # ── FreshRSS (heavensfeel) ─────────────────────────────────────────────────
    freshrss:
      entryPoints: [websecure]
      rule: "Host(`rss.example.com`)"
      service: freshrss
      middlewares: [rate-limit]
      tls: { certResolver: le }

    # ── Cockpit (native, per-node) ─────────────────────────────────────────────
    cockpit-mili:
      entryPoints: [websecure]
      rule: "Host(`cockpit.example.com`)"
      service: cockpit-server
      tls: { certResolver: le }
    cockpit-eserver:
      entryPoints: [websecure]
      rule: "Host(`cockpite.example.com`)"
      service: cockpit-eserver
      tls: { certResolver: le }
    cockpit-heaven:
      entryPoints: [websecure]
      rule: "Host(`cockpith.example.com`)"
      service: cockpit-heaven
      tls: { certResolver: le }

    # ── Gluetun exception (qbittorrent behind VPN, host-IP routing) ────────────
    qbt:
      entryPoints: [websecure]
      rule: "Host(`qbt.example.com`)"
      service: qbt
      tls: { certResolver: le }

    # ── money-map (finance sync + read-only query page) ────────────────────────
    # INTERNAL ONLY — no Cloudflare record, so it resolves only through the AdGuard
    # wildcard. Hence no rate-limit: this file's convention is that public routers
    # carry one and internal-only routers don't. (It had one until 2026-10-15.)
    money-map:
      entryPoints: [websecure]
      rule: "Host(`money.example.com`)"
      service: money-map
      tls: { certResolver: le }

    # ── Actual Budget (milkymiracle) ───────────────────────────────────────────
    # INTERNAL ONLY: no Cloudflare CNAME, so it resolves only through the AdGuard
    # wildcard. That is also why it carries no rate-limit — this file's convention is
    # that public routers get one and internal-only routers don't. Do not add a
    # Cloudflare record for this one.
    actual-budget:
      entryPoints: [websecure]
      rule: "Host(`budget.example.com`)"
      service: actual-budget
      tls: { certResolver: le }

    # ── Sure (milkymiracle) ────────────────────────────────────────────────────
    # INTERNAL ONLY: no Cloudflare CNAME, so it resolves only through the AdGuard
    # wildcard. No rate-limit, per this file's convention. Do not add a CF record.
    sure:
      entryPoints: [websecure]
      rule: "Host(`sure.example.com`)"
      service: sure
      tls: { certResolver: le }

    # ── Home Assistant (heavensfeel) ───────────────────────────────────────────
    # INTERNAL ONLY: camera footage and vacuum control. No Cloudflare CNAME, so it
    # resolves only through the AdGuard wildcard. No rate-limit, per this file's
    # convention. Do not add a CF record.
    homeassistant:
      entryPoints: [websecure]
      rule: "Host(`ha.example.com`)"
      service: homeassistant
      tls: { certResolver: le }

  # ── Services ────────────────────────────────────────────────────────────────
  services:
    vaultwarden:    { loadBalancer: { servers: [{ url: "http://vaultwarden:80" }] } }
    n8n:            { loadBalancer: { servers: [{ url: "http://n8n:5678" }] } }
    archisteamfarm: { loadBalancer: { servers: [{ url: "http://archisteamfarm:1242" }] } }
